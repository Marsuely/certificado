<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uma história sobre inteligência artificial</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="caixa-principal">
    <section class="caixa-inicio">
      <h1>Uma história sobre inteligência artificial</h1>
      <p>
        Suas escolhas vão definir o futuro de uma pessoa em um mundo
        transformado pela inteligência artificial.
      </p>
      <button class="botao-iniciar">Iniciar</button>
    </section>

    <section class="caixa-jogo" hidden>
      <div class="progresso"></div>
      <div class="caixa-perguntas"></div>
      <div class="caixa-alternativas"></div>
    </section>

    <section class="caixa-resultado" hidden>
      <h2>O futuro de <span class="nome-final"></span></h2>
      <p class="texto-resultado"></p>
      <button class="botao-reiniciar">Jogar Novamente</button>
    </section>
  </main>
</body>
</html>
